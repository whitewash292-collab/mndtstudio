  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic 8Ball 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    #space-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    body {
      background: #000000;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      position: relative;
      z-index: 1;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
    .instruction {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      text-align: center;
      opacity: 0.8;
      pointer-events: none;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
    }
    .answer-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 28.8px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      max-width: 80%;
      z-index: 100;
      letter-spacing: 2px;
      filter: drop-shadow(0 0 20px currentColor)
              drop-shadow(0 0 40px currentColor);
      transition: color 0.3s ease;
    }
  </style>
</head>

    // Three.js variables
    let scene, camera, renderer, ball;

    let rotationVelocity = { x: 0, y: 0 };
    let isAnimating = false;
    let currentAnswer = '';

    // Space background variables
    const spaceCanvas = document.getElementById('space-background');
    const spaceCtx = spaceCanvas.getContext('2d');
    let stars = [];
    let backgroundLights = [];

    function initSpace() {
      spaceCanvas.width = window.innerWidth;
      spaceCanvas.height = window.innerHeight;

      // Create stars
      for (let i = 0; i < 300; i++) {
        stars.push({
          x: Math.random() * spaceCanvas.width,
          y: Math.random() * spaceCanvas.height,
          radius: Math.random() * 1.5 + 0.5,
          speedX: (Math.random() - 0.5) * 0.12,
          speedY: (Math.random() - 0.5) * 0.12,
          opacity: Math.random() * 0.5 + 0.5,
          twinkleSpeed: Math.random() * 0.02 + 0.01,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }

      // Create background lights - 구슬 안 불빛과 정확히 동일하게 4개
      const lightColors = [
        { r: 255, g: 20, b: 147 },   // Pink (light1)
        { r: 0, g: 212, b: 255 },    // Cyan (light2)
        { r: 77, g: 77, b: 255 },    // Blue (light3)
        { r: 255, g: 170, b: 0 }     // Orange (light4)
      ];

      for (let i = 0; i < 4; i++) {
        const color = lightColors[i];
        backgroundLights.push({
          x: spaceCanvas.width / 2,
          y: spaceCanvas.height / 2,
          baseRadius: Math.random() * 200 + 150,
          color: color,
          currentColor: { r: color.r, g: color.g, b: color.b },
          pulsePhase: Math.random() * Math.PI * 2,
          pulseSpeed: Math.random() * 0.01 + 0.005,
          burstScale: 1.0,
          depthScale: 1.0
        });
      }

      animateSpace();
    }

    function animateSpace() {
      // Clear canvas
      spaceCtx.fillStyle = 'rgba(0, 0, 0, 1)';
      spaceCtx.fillRect(0, 0, spaceCanvas.width, spaceCanvas.height);

      // Draw background lights - 구슬 안 불빛과 정확히 1:1 매칭
      const time = Date.now() * 0.001;
      
      // 화면 중앙을 원점(0,0)으로 설정
      const centerX = spaceCanvas.width / 2;
      const centerY = spaceCanvas.height / 2;
      
      // 3D 좌표를 2D 화면 좌표로 변환하는 스케일
      const scale = Math.min(spaceCanvas.width, spaceCanvas.height) / 15;
      
      if (!isAnimating) {
        // 구슬 안 불빛과 정확히 동일한 위치 계산 (4개만) - 속도 50% 감속
        const slowTime = time * 0.5; // 속도 50% 감속
        
        // light1: position.x = Math.sin(time * 0.7) * 5; position.y = Math.cos(time * 0.5) * 5;
        backgroundLights[0].x = centerX + Math.sin(slowTime * 0.7) * 5 * scale;
        backgroundLights[0].y = centerY - Math.cos(slowTime * 0.5) * 5 * scale;
        backgroundLights[0].depthScale = 1.0;
        
        // light2: position.x = Math.cos(time * 0.3) * 5; position.y = Math.sin(time * 0.4) * 5;
        backgroundLights[1].x = centerX + Math.cos(slowTime * 0.3) * 5 * scale;
        backgroundLights[1].y = centerY - Math.sin(slowTime * 0.4) * 5 * scale;
        backgroundLights[1].depthScale = 1.0;
        
        // light3: position.x = Math.sin(time * 0.5) * 5; position.z = Math.cos(time * 0.6) * 5;
        backgroundLights[2].x = centerX + Math.sin(slowTime * 0.5) * 5 * scale;
        backgroundLights[2].y = centerY;
        backgroundLights[2].depthScale = 1 + Math.cos(slowTime * 0.6) * 0.3;
        
        // light4: position.y = Math.sin(time * 0.45) * 5; position.z = Math.cos(time * 0.35) * 5;
        backgroundLights[3].x = centerX;
        backgroundLights[3].y = centerY - Math.sin(slowTime * 0.45) * 5 * scale;
        backgroundLights[3].depthScale = 1 + Math.cos(slowTime * 0.35) * 0.3;
      }
      
      backgroundLights.forEach(light => {
        light.pulsePhase += light.pulseSpeed;
        const pulse = 0.5 + Math.sin(light.pulsePhase) * 0.3;

        // 구슬 안 불빛보다 202.5% 크게 (2.025배) - 이전 1.35배에서 50% 증가
        const depthScale = light.depthScale || 1;
        const currentRadius = light.baseRadius * light.burstScale * depthScale * 2.025;

        const gradient = spaceCtx.createRadialGradient(
          light.x, light.y, 0,
          light.x, light.y, currentRadius
        );
        
        const r = light.currentColor.r;
        const g = light.currentColor.g;
        const b = light.currentColor.b;
        
        // 밝기 50% 증가 (불투명도 1.5배)
        gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${0.45 * pulse})`);
        gradient.addColorStop(0.2, `rgba(${r}, ${g}, ${b}, ${0.3 * pulse})`);
        gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${0.15 * pulse})`);
        gradient.addColorStop(0.8, `rgba(${r}, ${g}, ${b}, ${0.045 * pulse})`);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        spaceCtx.fillStyle = gradient;
        spaceCtx.fillRect(
          light.x - currentRadius, 
          light.y - currentRadius, 
          currentRadius * 2, 
          currentRadius * 2
        );

        // Extra glow layer - 밝기 50% 증가
        const glowGradient = spaceCtx.createRadialGradient(
          light.x, light.y, 0,
          light.x, light.y, currentRadius * 1.5
        );
        glowGradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${0.12 * pulse})`);
        glowGradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${0.06 * pulse})`);
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        spaceCtx.fillStyle = glowGradient;
        spaceCtx.fillRect(
          light.x - currentRadius * 1.5, 
          light.y - currentRadius * 1.5, 
          currentRadius * 3, 
          currentRadius * 3
        );
      });

      // Draw stars
      stars.forEach(star => {
        star.twinklePhase += star.twinkleSpeed;
        const twinkle = Math.sin(star.twinklePhase) * 0.3 + 0.7;
        
        spaceCtx.beginPath();
        spaceCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        spaceCtx.fillStyle = `rgba(255, 255, 255, ${star.opacity * twinkle})`;
        spaceCtx.fill();

        star.x += star.speedX;
        star.y += star.speedY;

        if (star.x < 0) star.x = spaceCanvas.width;
        if (star.x > spaceCanvas.width) star.x = 0;
        if (star.y < 0) star.y = spaceCanvas.height;
        if (star.y > spaceCanvas.height) star.y = 0;
      });

      requestAnimationFrame(animateSpace);
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 8;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x000000, 0);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Ambient Light
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambientLight);

      // Point Lights - 8ball02.html과 동일한 설정
      light1 = new THREE.PointLight(0xff1493, 2, 100); // Pink
      light1.position.set(5, 5, 5);
      light1.castShadow = true;
      scene.add(light1);

      light2 = new THREE.PointLight(0x00d4ff, 2, 100); // Cyan
      light2.position.set(-5, -5, 5);
      scene.add(light2);

      light3 = new THREE.PointLight(0x4d4dff, 2, 100); // Blue
      light3.position.set(0, 5, -5);
      scene.add(light3);

      light4 = new THREE.PointLight(0xffaa00, 2, 100); // Orange
      light4.position.set(-5, 0, -5);
      scene.add(light4);

      const spotLight = new THREE.SpotLight(0xffffff, 0.8);
      spotLight.position.set(0, 10, 10);
      spotLight.castShadow = true;
      scene.add(spotLight);

      createBall();

      renderer.domElement.addEventListener('mousedown', onMouseDown);
      renderer.domElement.addEventListener('mousemove', onMouseMove);
      renderer.domElement.addEventListener('mouseup', onMouseUp);
      renderer.domElement.addEventListener('click', onBallClick);
      
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function createBall() {
      const geometry = new THREE.SphereGeometry(2.5, 64, 64);
      
      const material = new THREE.MeshPhongMaterial({
        color: 0x0a0a0a,
        shininess: 100,
        specular: 0x333333,
      });

      ball = new THREE.Mesh(geometry, material);
      ball.castShadow = true;
      ball.receiveShadow = true;
      scene.add(ball);

      const innerGeometry = new THREE.SphereGeometry(2.475, 32, 32);
      const innerMaterial = new THREE.MeshPhongMaterial({
        color: 0x1a1a1a,
        shininess: 150,
        specular: 0x666666,
        transparent: true,
        opacity: 0.6,
      });
      const innerSphere = new THREE.Mesh(innerGeometry, innerMaterial);
      ball.add(innerSphere);
    }

    function onMouseDown(e) {
      if (isAnimating) return;
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    }

    function onMouseMove(e) {
      if (!isDragging || isAnimating) return;

      const deltaMove = {
        x: e.clientX - previousMousePosition.x,
        y: e.clientY - previousMousePosition.y
      };

      rotationVelocity.x = deltaMove.y * 0.005;
      rotationVelocity.y = deltaMove.x * 0.005;

      ball.rotation.x += rotationVelocity.x;
      ball.rotation.y += rotationVelocity.y;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    }

    function onMouseUp() {
      isDragging = false;
    }

    // 모바일 흔들기 감지 (안드로이드/아이폰 모두 지원)
    let lastShakeTime = 0;
    let lastX = 0, lastY = 0, lastZ = 0;
    const shakeThreshold = 15; // 흔들기 감지 임계값
    const shakeTimeGap = 1000; // 흔들기 간격 (1초)

    function handleDeviceMotion(event) {
      if (isAnimating) return;

      const currentTime = Date.now();
      if (currentTime - lastShakeTime < shakeTimeGap) return;

      const acceleration = event.accelerationIncludingGravity;
      if (!acceleration) return;

      const x = acceleration.x || 0;
      const y = acceleration.y || 0;
      const z = acceleration.z || 0;

      // 가속도 변화량 계산
      const deltaX = Math.abs(x - lastX);
      const deltaY = Math.abs(y - lastY);
      const deltaZ = Math.abs(z - lastZ);

      // 흔들기 감지
      if (deltaX > shakeThreshold || deltaY > shakeThreshold || deltaZ > shakeThreshold) {
        lastShakeTime = currentTime;
        
        // 답변 생성
        const randomIndex = Math.floor(Math.random() * answers.length);
        currentAnswer = answers[randomIndex];
        performAnimation();
      }

      lastX = x;
      lastY = y;
      lastZ = z;
    }

    // 모바일 기기 감지 및 이벤트 리스너 등록
    function initShakeDetection() {
      if (typeof DeviceMotionEvent !== 'undefined') {
        // iOS 13+ 권한 요청
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(permissionState => {
              if (permissionState === 'granted') {
                window.addEventListener('devicemotion', handleDeviceMotion);
              }
            })
            .catch(console.error);
        } else {
          // 안드로이드 및 이전 iOS 버전
          window.addEventListener('devicemotion', handleDeviceMotion);
        }
      }
    }

    function onBallClick(e) {
      if (isAnimating || isDragging) return;

      const randomIndex = Math.floor(Math.random() * answers.length);
      currentAnswer = answers[randomIndex];
      
      performAnimation();
    }

    function performAnimation() {
      if (isAnimating) return;
      isAnimating = true;

      const answerElement = document.getElementById('answerOverlay');
      
      // 이전 답변 숨기기
      answerElement.style.opacity = '0';
      answerElement.style.transform = 'translate(-50%, -50%) scale(0.5)';
      
      answerElement.textContent = currentAnswer;

      // Shake animation - 0.2초
      let shakePhase = 0;
      const shakeDuration = 12; // 0.2초 (60fps 기준)
      const shakeIntensity = 0.15;

      const shakeInterval = setInterval(() => {
        shakePhase++;
        const progress = shakePhase / shakeDuration;

        if (shakePhase < shakeDuration) {
          const shake = Math.sin(shakePhase * 0.5) * shakeIntensity * (1 - progress);
          ball.rotation.x += shake;
          ball.rotation.y += shake * 0.7;
          ball.rotation.z += shake * 0.5;
        } else {
          clearInterval(shakeInterval);
          showAnswer();
        }
      }, 16);
    }

    function showAnswer() {
      const answerElement = document.getElementById('answerOverlay');
      
      const initialPositions = [
        { x: light1.position.x, y: light1.position.y, z: light1.position.z },
        { x: light2.position.x, y: light2.position.y, z: light2.position.z },
        { x: light3.position.x, y: light3.position.y, z: light3.position.z },
        { x: light4.position.x, y: light4.position.y, z: light4.position.z }
      ];

      const initialColors = [
        new THREE.Color(light1.color),
        new THREE.Color(light2.color),
        new THREE.Color(light3.color),
        new THREE.Color(light4.color)
      ];

      const initialBgColors = backgroundLights.map(light => ({
        r: light.currentColor.r,
        g: light.currentColor.g,
        b: light.currentColor.b
      }));

      const auroraColors = [
        { r: 0.0, g: 1.0, b: 0.8 },
        { r: 0.5, g: 0.0, b: 1.0 },
        { r: 1.0, g: 0.2, b: 0.8 },
        { r: 0.0, g: 0.8, b: 1.0 }
      ];

      const randomColorIndex = Math.floor(Math.random() * auroraColors.length);
      const textColor = auroraColors[randomColorIndex];

      answerElement.style.opacity = '0';
      answerElement.style.transform = 'translate(-50%, -50%) scale(0.5)';

      let phase = 0;
      const totalPhases = 45;
      const centerPoint = { x: 0, y: 0, z: 5 };
      
      const burstInterval = setInterval(() => {
        phase++;
        
        if (phase <= 25) {
          const mergeProgress = easeInOutCubic(phase / 25);
          
          // Move lights to center
          light1.position.x = initialPositions[0].x + (centerPoint.x - initialPositions[0].x) * mergeProgress;
          light1.position.y = initialPositions[0].y + (centerPoint.y - initialPositions[0].y) * mergeProgress;
          light1.position.z = initialPositions[0].z + (centerPoint.z - initialPositions[0].z) * mergeProgress;
          
          light2.position.x = initialPositions[1].x + (centerPoint.x - initialPositions[1].x) * mergeProgress;
          light2.position.y = initialPositions[1].y + (centerPoint.y - initialPositions[1].y) * mergeProgress;
          light2.position.z = initialPositions[1].z + (centerPoint.z - initialPositions[1].z) * mergeProgress;
          
          light3.position.x = initialPositions[2].x + (centerPoint.x - initialPositions[2].x) * mergeProgress;
          light3.position.y = initialPositions[2].y + (centerPoint.y - initialPositions[2].y) * mergeProgress;
          light3.position.z = initialPositions[2].z + (centerPoint.z - initialPositions[2].z) * mergeProgress;
          
          light4.position.x = initialPositions[3].x + (centerPoint.x - initialPositions[3].x) * mergeProgress;
          light4.position.y = initialPositions[3].y + (centerPoint.y - initialPositions[3].y) * mergeProgress;
          light4.position.z = initialPositions[3].z + (centerPoint.z - initialPositions[3].z) * mergeProgress;
          
          // Change colors
          light1.color.setRGB(
            initialColors[0].r + (auroraColors[0].r - initialColors[0].r) * mergeProgress,
            initialColors[0].g + (auroraColors[0].g - initialColors[0].g) * mergeProgress,
            initialColors[0].b + (auroraColors[0].b - initialColors[0].b) * mergeProgress
          );
          light2.color.setRGB(
            initialColors[1].r + (auroraColors[1].r - initialColors[1].r) * mergeProgress,
            initialColors[1].g + (auroraColors[1].g - initialColors[1].g) * mergeProgress,
            initialColors[1].b + (auroraColors[1].b - initialColors[1].b) * mergeProgress
          );
          light3.color.setRGB(
            initialColors[2].r + (auroraColors[2].r - initialColors[2].r) * mergeProgress,
            initialColors[2].g + (auroraColors[2].g - initialColors[2].g) * mergeProgress,
            initialColors[2].b + (auroraColors[2].b - initialColors[2].b) * mergeProgress
          );
          light4.color.setRGB(
            initialColors[3].r + (auroraColors[3].r - initialColors[3].r) * mergeProgress,
            initialColors[3].g + (auroraColors[3].g - initialColors[3].g) * mergeProgress,
            initialColors[3].b + (auroraColors[3].b - initialColors[3].b) * mergeProgress
          );
          
          // Background lights - 구슬 안 불빛과 똑같이 중심으로 이동
          const bgCenterX = spaceCanvas.width / 2;
          const bgCenterY = spaceCanvas.height / 2;
          
          if (backgroundLights.length >= 4) {
            // 각 배경 라이트의 초기 위치 저장 (첫 프레임에만)
            if (!backgroundLights[0].initialX) {
              backgroundLights.forEach((bgLight, i) => {
                bgLight.initialX = bgLight.x;
                bgLight.initialY = bgLight.y;
              });
            }
            
            // 구슬 안 라이트처럼 중심으로 모이기
            backgroundLights.forEach((bgLight, i) => {
              bgLight.x = bgLight.initialX + (bgCenterX - bgLight.initialX) * mergeProgress;
              bgLight.y = bgLight.initialY + (bgCenterY - bgLight.initialY) * mergeProgress;
            });
          }
          
          backgroundLights.forEach((bgLight, i) => {
            const targetAurora = auroraColors[i % auroraColors.length];
            bgLight.currentColor = {
              r: Math.floor(initialBgColors[i].r + (targetAurora.r * 255 - initialBgColors[i].r) * mergeProgress),
              g: Math.floor(initialBgColors[i].g + (targetAurora.g * 255 - initialBgColors[i].g) * mergeProgress),
              b: Math.floor(initialBgColors[i].b + (targetAurora.b * 255 - initialBgColors[i].b) * mergeProgress)
            };
            bgLight.burstScale = 1.0 + mergeProgress * 2.0;
          });
          
          const intensityProgress = easeOutQuad(mergeProgress);
          light1.intensity = 2 + intensityProgress * 18;
          light2.intensity = 2 + intensityProgress * 18;
          light3.intensity = 2 + intensityProgress * 18;
          light4.intensity = 2 + intensityProgress * 18;
          
          answerElement.style.opacity = mergeProgress;
          const textScale = 0.5 + mergeProgress * 0.5;
          answerElement.style.transform = `translate(-50%, -50%) scale(${textScale})`;
          
          const brightness = 0.3 + mergeProgress * 0.7;
          const r = Math.floor(textColor.r * 255 * brightness);
          const g = Math.floor(textColor.g * 255 * brightness);
          const b = Math.floor(textColor.b * 255 * brightness);
          answerElement.style.color = `rgb(${r}, ${g}, ${b})`;
          
        } else {
          const fadeProgress = easeInOutCubic((phase - 25) / 20);
          
          // Return to original positions
          light1.position.x = centerPoint.x + (initialPositions[0].x - centerPoint.x) * fadeProgress;
          light1.position.y = centerPoint.y + (initialPositions[0].y - centerPoint.y) * fadeProgress;
          light1.position.z = centerPoint.z + (initialPositions[0].z - centerPoint.z) * fadeProgress;
          
          light2.position.x = centerPoint.x + (initialPositions[1].x - centerPoint.x) * fadeProgress;
          light2.position.y = centerPoint.y + (initialPositions[1].y - centerPoint.y) * fadeProgress;
          light2.position.z = centerPoint.z + (initialPositions[1].z - centerPoint.z) * fadeProgress;
          
          light3.position.x = centerPoint.x + (initialPositions[2].x - centerPoint.x) * fadeProgress;
          light3.position.y = centerPoint.y + (initialPositions[2].y - centerPoint.y) * fadeProgress;
          light3.position.z = centerPoint.z + (initialPositions[2].z - centerPoint.z) * fadeProgress;
          
          light4.position.x = centerPoint.x + (initialPositions[3].x - centerPoint.x) * fadeProgress;
          light4.position.y = centerPoint.y + (initialPositions[3].y - centerPoint.y) * fadeProgress;
          light4.position.z = centerPoint.z + (initialPositions[3].z - centerPoint.z) * fadeProgress;
          
          const colorProgress = easeInOutCubic(fadeProgress);
          light1.color.setRGB(
            auroraColors[0].r + (initialColors[0].r - auroraColors[0].r) * colorProgress,
            auroraColors[0].g + (initialColors[0].g - auroraColors[0].g) * colorProgress,
            auroraColors[0].b + (initialColors[0].b - auroraColors[0].b) * colorProgress
          );
          light2.color.setRGB(
            auroraColors[1].r + (initialColors[1].r - auroraColors[1].r) * colorProgress,
            auroraColors[1].g + (initialColors[1].g - auroraColors[1].g) * colorProgress,
            auroraColors[1].b + (initialColors[1].b - auroraColors[1].b) * colorProgress
          );
          light3.color.setRGB(
            auroraColors[2].r + (initialColors[2].r - auroraColors[2].r) * colorProgress,
            auroraColors[2].g + (initialColors[2].g - auroraColors[2].g) * colorProgress,
            auroraColors[2].b + (initialColors[2].b - auroraColors[2].b) * colorProgress
          );
          light4.color.setRGB(
            auroraColors[3].r + (initialColors[3].r - auroraColors[3].r) * colorProgress,
            auroraColors[3].g + (initialColors[3].g - auroraColors[3].g) * colorProgress,
            auroraColors[3].b + (initialColors[3].b - auroraColors[3].b) * colorProgress
          );
          
          // Background lights - 구슬 안 불빛처럼 원래 위치로 복귀
          const bgCenterX = spaceCanvas.width / 2;
          const bgCenterY = spaceCanvas.height / 2;
          
          if (backgroundLights.length >= 4) {
            backgroundLights.forEach((bgLight, i) => {
              bgLight.x = bgCenterX + (bgLight.initialX - bgCenterX) * fadeProgress;
              bgLight.y = bgCenterY + (bgLight.initialY - bgCenterY) * fadeProgress;
            });
          }
          
          backgroundLights.forEach((bgLight, i) => {
            const targetAurora = auroraColors[i % auroraColors.length];
            const currentAurora = {
              r: targetAurora.r * 255,
              g: targetAurora.g * 255,
              b: targetAurora.b * 255
            };
            bgLight.currentColor = {
              r: Math.floor(currentAurora.r + (initialBgColors[i].r - currentAurora.r) * colorProgress),
              g: Math.floor(currentAurora.g + (initialBgColors[i].g - currentAurora.g) * colorProgress),
              b: Math.floor(currentAurora.b + (initialBgColors[i].b - currentAurora.b) * colorProgress)
            };
            bgLight.burstScale = 3.0 - fadeProgress * 2.0;
          });
          
          const intensityFade = easeInQuad(1 - fadeProgress);
          light1.intensity = 20 * intensityFade + 2 * fadeProgress;
          light2.intensity = 20 * intensityFade + 2 * fadeProgress;
          light3.intensity = 20 * intensityFade + 2 * fadeProgress;
          light4.intensity = 20 * intensityFade + 2 * fadeProgress;
          
          answerElement.style.opacity = '1';
          answerElement.style.transform = 'translate(-50%, -50%) scale(1)';
          const r = Math.floor(textColor.r * 255);
          const g = Math.floor(textColor.g * 255);
          const b = Math.floor(textColor.b * 255);
          answerElement.style.color = `rgb(${r}, ${g}, ${b})`;
        }
        
        if (phase >= totalPhases) {
          clearInterval(burstInterval);
          
          light1.position.copy(initialPositions[0]);
          light2.position.copy(initialPositions[1]);
          light3.position.copy(initialPositions[2]);
          light4.position.copy(initialPositions[3]);
          
          light1.color.copy(initialColors[0]);
          light2.color.copy(initialColors[1]);
          light3.color.copy(initialColors[2]);
          light4.color.copy(initialColors[3]);
          
          light1.intensity = 2;
          light2.intensity = 2;
          light3.intensity = 2;
          light4.intensity = 2;
          
          backgroundLights.forEach((bgLight, i) => {
            bgLight.currentColor = {
              r: initialBgColors[i].r,
              g: initialBgColors[i].g,
              b: initialBgColors[i].b
            };
            bgLight.burstScale = 1.0;
            // 초기 위치 정보 리셋
            delete bgLight.initialX;
            delete bgLight.initialY;
          });
          
          // 답변 유지 - 다음 클릭 전까지 사라지지 않음
          isAnimating = false;
        }
      }, 16);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutQuad(t) {
      return 1 - (1 - t) * (1 - t);
    }

    function easeInQuad(t) {
      return t * t;
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging && !isAnimating) {
        rotationVelocity.x *= 0.95;
        rotationVelocity.y *= 0.95;
        ball.rotation.x += rotationVelocity.x;
        ball.rotation.y += rotationVelocity.y;
      }

      if (!isAnimating) {
        const time = Date.now() * 0.001;
        light1.position.x = Math.sin(time * 0.7) * 5;
        light1.position.y = Math.cos(time * 0.5) * 5;
        
        light2.position.x = Math.cos(time * 0.3) * 5;
        light2.position.y = Math.sin(time * 0.4) * 5;
        
        light3.position.x = Math.sin(time * 0.5) * 5;
        light3.position.z = Math.cos(time * 0.6) * 5;
        
        light4.position.y = Math.sin(time * 0.45) * 5;
        light4.position.z = Math.cos(time * 0.35) * 5;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      spaceCanvas.width = window.innerWidth;
      spaceCanvas.height = window.innerHeight;
    }

    window.addEventListener('load', () => {
      initSpace();
      init();
      initShakeDetection(); // 모바일 흔들기 감지 초기화
    });
  </script>
</body>
</html>
